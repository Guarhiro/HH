<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honey House · BGM試聴</title>
<style>body{max-width:720px;margin:auto;padding:40px 22px;background:#f6f1e7;color:#2e4438;font:16px/1.7 system-ui}h1{line-height:1.2}small{color:#637466}section{background:#fffdf7;border:1px solid #d5c7a5;border-radius:18px;padding:24px;margin:24px 0}audio{width:100%;margin:12px 0}button{font:inherit;border:1px solid #67816e;border-radius:10px;padding:9px 18px;background:#2e503e;color:white;margin:6px 8px 0 0;cursor:pointer}a{color:#326b55}#state{font-variant-numeric:tabular-nums}code{word-break:break-all;font-size:13px}footer{font-size:13px}</style></head>
<body><small>HONEY HOUSE / AUDIO TEST</small><h1>日常に、ふたつの音色。</h1><p>外部リンクと音声再生の検証用に作った、16秒の短いオリジナル音列です。</p>
<section><h2 id="track">A · 屋敷の朝</h2><audio id="player" controls loop preload="metadata" src="./bgm/house-test.mp3"></audio><div><button type="button" data-track="house">A · 屋敷の朝</button><button type="button" data-track="garden">B · 庭のひと休み</button><button id="stop" type="button">停止</button></div><p id="state" role="status">読み込み中</p><p><small>最初にプレーヤーの再生ボタンを押してください。曲を選ぶと切り替わり、停止するまで繰り返します。</small></p></section>
<section><h2>音源への直接リンク</h2><p><a href="./bgm/house-test.mp3">A · MP3を開く</a> / <a href="./bgm/garden-test.mp3">B · MP3を開く</a></p><p><small>STORY ENGINEでリンクを利用する場合の配信元です。チャットの変数とは自動連携しません。</small></p></section>
<footer>Original test tones · 2026 · <a href="https://github.com/Guarhiro/HH">GitHub</a></footer>
<script>const player=document.getElementById('player'),state=document.getElementById('state'),title=document.getElementById('track');player.volume=.25;const tracks={house:{name:'A · 屋敷の朝',src:'./bgm/house-test.mp3'},garden:{name:'B · 庭のひと休み',src:'./bgm/garden-test.mp3'}};function show(){state.textContent=(player.paused?'停止中':'再生中')+' · '+player.currentTime.toFixed(1)+' / '+(Number.isFinite(player.duration)?player.duration.toFixed(1):'—')+' 秒';}document.querySelectorAll('[data-track]').forEach(b=>b.onclick=async()=>{const resume=!player.paused,t=tracks[b.dataset.track];player.src=t.src;title.textContent=t.name;player.load();if(resume){try{await player.play()}catch(e){state.textContent=e.message}}show()});document.getElementById('stop').onclick=()=>{player.pause();player.currentTime=0;show()};['loadedmetadata','timeupdate','playing','pause','emptied'].forEach(e=>player.addEventListener(e,show));player.addEventListener('error',()=>{state.textContent='音声を読み込めませんでした'});</script></body></html>
